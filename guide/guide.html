<script type="text/javascript">
    const dateNow = Date.now();  // 캐시방지
	console.log(dateNow);

$(document).ready(function() {
    $(document).on('click', '.goLink li a', function(e) {
        e.preventDefault();
        var $li = $(this).closest('li');
        $('.goLink li').removeClass('active');
        $li.addClass('active');
        var getURL = $(this).attr('data-href');
        if (getURL) {
            openURL(getURL);
        }
    });

    $(document).on('click', '.tabTy1 li a, .tabTy2 li a, .stabTy1 li a, .tabTy3 li a, .tabTy4 li a, .tabTy5 li a', function(e) {
        e.preventDefault();
        $(this).closest('ul').find('li').removeClass('active');
        $(this).closest('li').addClass('active');
    });

    openURL('layout.html');
});

function bottomSheet(value){
	var val = value;
	var obj = $('.bottomSheet');
	obj.close = $('.dim, .bottomSheet .close, .bottomSheet .sheetClose');
	obj.find('.inCont').removeClass('active');
	obj.find('.inCont.ty'+val).addClass('active');
	obj.addClass('active');

	obj.close.on('click', function(){
		obj.removeClass('active');
	});
};

function openURL(getURL){
    if (!getURL) return;
    fetch(getURL, {
        cache : 'no-cache'
    }).then(function(res){
        if (!res.ok) {
            throw new Error('HTTP ' + res.status + ' (' + res.statusText + ')');
        }
        return res.arrayBuffer();
    }).then(function(buffer){
        let text = '';
        try {
            const utf8Decoder = new TextDecoder('utf-8', { fatal: true });
            text = utf8Decoder.decode(buffer);
        } catch(e) {
            const euckrDecoder = new TextDecoder('euc-kr');
            text = euckrDecoder.decode(buffer);
        }
        let parser = new DOMParser();
        let htmlDom = parser.parseFromString(text,'text/html');
        var contWrap = htmlDom.querySelector('.contWrap');
        var guideCont = document.querySelector('.guideCont');
        if (guideCont) {
            if (contWrap) {
                guideCont.innerHTML = contWrap.outerHTML;
            } else {
                var body = htmlDom.querySelector('body') || htmlDom;
                guideCont.innerHTML = body.innerHTML;
            }
            guideCont.scrollTo(0,0);
        }
        var txtElem = document.getElementById('txt');
        if (txtElem) txtElem.innerHTML = getURL;

        $('.guideCont .end').each(function(index, item){
            $(this).parent().append('<br><span class="layBtn btnTy8 light" style="margin-top:10px;display:inline-block;cursor:pointer">라이트</span> <span class="layBtn btnTy8 dark" style="margin-top:10px;display:inline-block;cursor:pointer">다크</span>');
        });
        if (typeof ui !== 'undefined' && ui.init) ui.init();
        if (typeof fontCal === 'function') fontCal();
    }).catch(function(err){
        console.error('가이드 로드 실패:', err);
    });
}

var ui = {
    layer : function(e){
        $(".layBtn").click(function(){
            $(".layBtn").removeClass('active');
            $(this).addClass('active');
            var link = $(this).parent().find('.end').attr("href").replace(' ','')+'?ver='+dateNow;
            var linkDark = $(this).parent().find('.end').attr("href").replace(' ','')+'?d&var='+dateNow;

            let _this = $(this);
            if(_this.is('.light')) {
                $(".preview_wrap").show().find(".tit a").attr("href", link).text(link);
                $(".preview_wrap").find("iframe").attr("src", link);
            } else {
                $(".preview_wrap").show().find(".tit a").attr("href", linkDark).text(linkDark);
                $(".preview_wrap").find("iframe").attr("src", linkDark);
            }
        });
        $(".close").click(function(){
            $(".preview_wrap").hide();
        });
    },
    viewBtm :function(opts){
        var _thisBtn = $(".viewBtn button");
        var _layout = $(".layout");
        _thisBtn.on('click', function(){
            var _btnClass = $(this).attr('class');
            $(this).addClass('active');
            $('button').not(this).removeClass('active');
            _layout.removeClass().addClass('layout '+ _btnClass);
        });
    },
    bottomSheet : function(value){
        var val = value;
        var obj = $('.bottomSheet');
        obj.close = $('.dim, .bottomSheet .close, .bottomSheet .sheetClose');
        obj.find('.inCont').removeClass('active');
        obj.find('.inCont.ty'+val).addClass('active');
        obj.addClass('active');

        obj.close.on('click', function(){
            obj.removeClass('active');
        });
    },
    accordion : function(){
        // graph image change
        if ( $('.compareRate').get(0) !== undefined)  {
            $('.btnListCR li a').on('click', function() {
                var $thisImg = $('.areaGraph img');
                var liAll = $('.btnListCR li');
                var $thisIndex = $(this).closest('li').index();
                var activeClass = 'active';
                liAll.removeClass(activeClass);
                liAll.eq($thisIndex).addClass(activeClass);
                $thisImg.removeClass(activeClass);
                $thisImg.eq($thisIndex - 1).addClass(activeClass);
            })
        }

        // scroll tab box shadow
        if ( $('.includeTab').get(0) !== undefined)  {
            $(window).on('scroll',function () {
                if ($(document).scrollTop() > 0) {
                    $('.includeTab > div').addClass('scrollActive');
                } else {
                    $('.includeTab > div').removeClass('scrollActive');
                }
            });
        }

        // scroll tab last menu position: tabTy5
        if ( $('.tabTy5').get(0) !== undefined)  {
            if ($('.tabTy5').hasClass('lastMenu')) {
                var bWidth = $('body').outerWidth();
                $('.wrapTabTy5').scrollLeft(bWidth);
            }
        }

        // toggleList: content visible/hidden
        if ( $('.toggleList').get(0) !== undefined)  {
            
            var offsets = [],
                faqTit = $('.toggleAccordion li > a'),
                beforeThis = '',
                offsetsList = function () {
                    faqTit.each(function(){
                        var $thisOffset = $(this).offset().top;
                        offsets.push($thisOffset);
                    });
                };
            setTimeout(offsetsList,100);
            $('.toggleList li > a').on('click',function() {
                var $this = $(this),
                    $thisLi = $this.closest('li'),
                    $thisUl = $this.closest('Ul'),
                    $thisIndex = $thisLi.index(),
                    activeClass = 'active';
                if (!$thisLi.hasClass(activeClass) ) {
                    if ($thisUl.hasClass('toggleAccordion')) {
                        if ( beforeThis !== '') {
                            $(beforeThis).removeClass(activeClass).find('.toggleBox').slideUp(100);
                        }
                        if ( $('.wrapTy5').hasClass('includeTab') && $('.toggleList').length === 1) {
                            $("html, body").animate({scrollTop:offsets[$thisIndex]-37}, 300);
                        } else if ( $('.toggleList').length === 1) {
                            $("html, body").animate({scrollTop:offsets[$thisIndex]}, 300);
                        }
                    }
                    $thisLi.toggleClass(activeClass).find('.toggleBox').slideToggle(100);
                    beforeThis = $thisLi;
                    return beforeThis;
                } else {
                    $thisLi.removeClass(activeClass).find('.toggleBox').slideUp(100);
                }
            });
        }

        // slide: guide
        if ($('.importantGuide').get(0) !== undefined) {
            var isArrows = true;
            var isDots = true;
            if (!$('.importantGuide').hasClass('ty2')) {
                isArrows = false;
            } else {
                isDots = false;
            }
            $('.importantGuide').slick(
                {
                    arrows:isArrows,
                    dots: isDots,
                    infinite: false
                }
            );
        }
    },
    menuList : function(e){
        var $front = $("#FrontList");
        if (!$front.length) return;
        var front = $front.get(0);
        if (!front) return;
        $(".tbTy1 a").html(function(){ if(((/\/[^\/]+\.html/).test(this.href)||(/\/[^\/]+\.jsp/).test(this.href)) && !this.href.match(/path.html/)){ return this.href.substring(this.href.lastIndexOf("/")+1); } }).each(function(){
            if(this.onclick) return false;
            else this.target = "_blank";
        });

        front.a = $front.find("a") || undefined;
        var end = front.a.filter(".end").filter(function(){ return ((/\/[^\/]+\.html/).test(this.href) || (/\/[^\/]+\.jsp/).test(this.href)) && !this.href.match(/path.html/); }).length;
        var ing = front.a.filter(".test").filter(function(){ return ((/\/[^\/]+\.html/).test(this.href) || (/\/[^\/]+\.jsp/).test(this.href)) && !this.href.match(/path.html/); }).length;
        $("#pages").find("em").eq(0).html(front.a.length).end()
            .eq(1).html(ing).end()
            .eq(2).html(end).end().end()
            .find("strong").html( (parseInt(( (end)/front.a.length )*1000)/10 || 0)+'%' );
        $(".listHead").html($("#pages").html());


        var lastdate = "0000-00-00";
        $("#FrontList .push-date, #FrontList .mod-date").each(function(){
            var compare = [this.innerHTML.replace(/-/gi,"") , lastdate.replace(/-/gi,"")];
            if(parseFloat(compare[0]) > parseFloat(compare[1])) lastdate = this.innerHTML;
        });
        $("#FrontList .push-date:contains('"+lastdate+"'), #FrontList .mod-date:contains('"+lastdate+"')").addClass("last"); //최근 전달일 체크
    },
    init : function(opts){
        opts = opts || {};
        ui.viewBtm();
        ui.accordion();
        ui.menuList();
        ui.layer();
    }
}


function fontCal(){
    const inputSize = document.querySelector('#fontSize');
    const inputResult = document.querySelector('#sizeResult');
    const inputRem = document.querySelector('#remResult');
    const inputBtn = document.querySelector('#calcBtn');

    if (!inputSize || !inputResult || !inputRem) return;

    function calculate() {
        const inValue = parseFloat(inputSize.value) || 0;
        const result = inValue * 2 / 3;
        inputResult.value = result.toFixed(2);
        inputRem.value = (result / 16).toFixed(4);
    }

    if (inputBtn) {
        inputBtn.onclick = calculate;
    }

    inputSize.addEventListener('keyup', function(event){
        if (event.key === 'Enter' || event.keyCode === 13) {
            event.preventDefault();
            calculate();
        }
    });
}

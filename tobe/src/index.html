<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mable 퍼블리싱 리스트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px;
      font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
      background-color: #f9fafb;
      color: #1f2937;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    .desc { color: #6b7280; font-size: 14px; margin: 0 0 32px; }
    h2 {
      font-size: 15px;
      font-weight: 700;
      color: #374151;
      margin: 0 0 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #FFDC00;
    }
    .section { margin-bottom: 36px; }
    ul { list-style: none; margin: 0; padding: 0; }
    li + li { margin-top: 8px; }
    a.pageLink {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background-color: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      text-decoration: none;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.15s;
    }
    a.pageLink:hover { border-color: #FFDC00; background-color: #fffdf0; }
    a.pageLink .path { color: #9ca3af; font-weight: 400; font-size: 12px; }
    a.pageLink::after { content: '>'; color: #9ca3af; font-weight: 400; margin-left: 12px; }
    .empty { color: #9ca3af; font-size: 13px; padding: 14px 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Mable 퍼블리싱 리스트</h1>
    <p class="desc">확인할 화면을 선택하세요.</p>

    <div class="section">
      <h2>Pages</h2>
      <ul>
        <li>
          <a class="pageLink" href="/pages/missionGuide.html">
            자산성장 산악회 미션 안내
            <span class="path">/pages/missionGuide.html</span>
          </a>
        </li>
      </ul>
    </div>

    <div class="section">
      <h2>Components 가이드</h2>
      <ul>
        <li>
          <a class="pageLink" href="/guide/guide.html">
            UI 컴포넌트 스타일 가이드
            <span class="path">/guide/guide.html</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</body>
</html>
